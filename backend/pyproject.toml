[project]
name = "openmcp-gateway"
version = "0.21.0"
description = "Auth, authorisation, rate limiting and observability in front of any MCP server"
requires-python = ">=3.14"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = [
  "fastmcp>=4.1.4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  # SQLAlchemy owns the pool and the query language; asyncpg is its driver.
  # No string SQL anywhere in the app.
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "argon2-cffi>=23.1",
  "pyyaml>=6.0",
  "pydantic>=2.9",
  # Google sign-in verifies an RS256 id_token in-process; both were already
  # present transitively through fastmcp, but the flow depends on them directly.
  "joserfc>=1.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-bdd>=7.3",
  "httpx>=0.27",
  "testcontainers[postgres]>=4.8",
  "ruff>=0.7",
]

[project.scripts]
omg = "gateway.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
# 100, not 88: this codebase has long domain sentences in docstrings and f-strings,
# and wrapping them costs readability for no gain.
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
