# The two secrets the gateway refuses to boot without.
#
# Do not commit the real values. Either copy this file to `secret.yaml` and fill it
# in (it is git-ignored), or create it imperatively:
#
#   kubectl -n support create secret generic openmcp-gateway \
#     --from-literal=database-url='postgresql://omg:...@postgres.persistence:5432/omg' \
#     --from-literal=session-secret="$(openssl rand -hex 32)" \
#     --from-literal=github-client-id='Ov23li...' \
#     --from-literal=github-client-secret='...'
#
# `google-client-id`/`google-client-secret` enable *admin UI* sign-in — a different
# login from the per-gateway OAuth that fronts MCP servers. Register
# `https://<host>/api/auth/google/callback` in the Google Cloud project for this one.
#
# `operator-allowlist` is who skips the tenant choice and lands in this
# installation's own tenant — an address book, not a gate. Everyone else who
# signs in gets an empty account and is asked to create or join a tenant.
#
# A gateway whose OAuth client is missing from here can still be created in the UI;
# it just serves 503 until the credentials are supplied through the UI or via a
# gateway-level `client_id` in a config file.
apiVersion: v1
kind: Secret
metadata:
  name: openmcp-gateway
  namespace: support
type: Opaque
stringData:
  database-url: postgresql://omg:CHANGE_ME@postgres.persistence.svc.cluster.local:5432/omg
  # openssl rand -hex 32 — must be at least 32 bytes or the process exits.
  session-secret: CHANGE_ME_TO_32_BYTES_OF_RANDOM_HEX
  github-client-id: ""
  github-client-secret: ""
  google-client-id: ""
  google-client-secret: ""
  operator-allowlist: ""
